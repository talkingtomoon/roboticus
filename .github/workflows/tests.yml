name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # phorce 피벗 이후 런타임 의존성은 numpy(+pyyaml)뿐이다.
  # torch는 delta 파이프라인(legacy/)과 함께 물러났다 — 잡도 제거.
  test:
    name: py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test
        run: pytest -q
      - name: Rehearsal scenarios (통합 리허설이 CI에서도 도는지)
        run: python -m robot_core.integration.scenarios --no-timeline
